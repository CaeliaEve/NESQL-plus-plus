name: CI

on:
  push:
    branches: [main, refactor/core]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: chmod +x ./gradlew
      - run: ./gradlew setupCIWorkspace --no-daemon
      - run: ./gradlew build --no-daemon
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxxf86vm1 libxcursor1 libxrandr2
      - run: xvfb-run -a ./gradlew glTest --no-daemon
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          NESQL_GL_WINDOW: '1'
      - run: node scripts/check-jar.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nesql
          path: build/libs/NESQL++-*.jar
          if-no-files-found: error

