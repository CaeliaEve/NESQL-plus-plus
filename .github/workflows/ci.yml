name: CI

on:
  push:
    branches:
      - main
      - elysium
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    name: NESQL++ source gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run stable JavaScript regression checks
        run: |
          node semantic-identity-regression.test.mjs

      - name: Verify Gradle wrapper is present
        run: |
          test -f gradlew
          test -f build.gradle.kts
          test -f gradle.properties

  gradle-build:
    name: NESQL++ Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          echo "NESQL_PROTOC_PATH=$(command -v protoc)" >> "$GITHUB_ENV"
          protoc --version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare ForgeGradle CI workspace
        run: ./gradlew setupCIWorkspace --no-daemon --stacktrace

      - name: Build diagnostics
        run: |
          if ! ./gradlew build -x test --no-daemon --stacktrace; then
            echo "::warning::Gradle build could not complete on hosted CI. This project still depends on local/legacy GTNH artifacts; source-gate remains authoritative until dependency vendoring is completed."
          fi

      - name: Upload jars when produced
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nesql-jars
          path: build/libs/*.jar
          if-no-files-found: warn

